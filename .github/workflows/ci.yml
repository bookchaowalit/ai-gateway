# CI + security baseline (DevSecOps Phase 1). Public repository: GitHub-hosted runners.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-node.yml@c37ef9d113eefb3ed45429717cb7ca201192c3fc # v1.0.1
    with:
      node-version: "22" # matches the node:22-slim image
      # No Biome/ESLint config or tsconfig yet: lint and typecheck are skipped with a warning
      # (follow-up). Tests: `npm test` (tsx --test tests/*.ts).
      # The build installs api/ai-gateway-service from its own lockfile and bundles it with esbuild,
      # the same steps as the Dockerfile.
      build-command: npm run build

  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@c37ef9d113eefb3ed45429717cb7ca201192c3fc # v1.0.1
